<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IronAge.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main_layout">
        <canvas id="game_canvas_foreground" width="800" height="800" hidden>
        </canvas>

        <div id="debug_panel">
            <h3>Render state</h3>
            <pre id="debug_entity_states"></pre>
        </div>
    </div>

    <div id="test_panel">
        <button id="run_websocket_tests">Run WebSocket tests</button>
        <pre id="websocket_test_output"></pre>
    </div>

    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/websocket_tests.js"></script>
</body>
</html>
