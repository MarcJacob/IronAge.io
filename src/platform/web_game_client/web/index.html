<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IronAge.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas_container">
        <canvas id="game_canvas_foreground" tabindex="1" hidden>
        </canvas>

        <div id="game_hud">
            <div id="game_hud_selected_panel" hidden>
                <pre id="game_hud_selected_text"></pre>
                <button id="game_hud_found_settlement" hidden>Found settlement</button>
                <button id="game_hud_spawn_army" hidden>Spawn army</button>
                <button id="game_hud_spawn_caravan" hidden>Spawn caravan</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
