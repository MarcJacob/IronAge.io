<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IronAge.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas_container">
        <canvas id="game_canvas_foreground" tabindex="1" hidden>
        </canvas>

        <div id="game_hud">
            <div id="game_hud_selected_panel" hidden>
                <div id="game_hud_selected_header"></div>
                <pre id="game_hud_selected_text"></pre>
            </div>

            <div id="game_hud_section_bottom">
                <div id="game_hud_player_state" hidden></div>
                <div id="game_hud_properties_panel" hidden>
                    <div id="game_hud_properties_title"></div>
                    <div id="game_hud_properties_rows"></div>
                </div>

                <div id="game_hud_action_bar" hidden></div>
            </div>

            <div id="game_hud_calendar" hidden>
                <div id="game_hud_calendar_text"></div>
                <div id="game_hud_calendar_bar"><div id="game_hud_calendar_fill"></div></div>
            </div>


            <div id="game_hud_tooltip" hidden></div>
        </div>

        <div id="placement_ui" hidden>
            <div id="placement_ui_message">Placement</div>
            <div id="placement_ui_bar"><div id="placement_ui_bar_fill"></div></div>
        </div>

        <div id="lobby_ui" hidden>
            <div id="lobby_ui_notice" hidden></div>
            <div id="lobby_ui_countdown"></div>
            <div id="lobby_ui_players"></div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
