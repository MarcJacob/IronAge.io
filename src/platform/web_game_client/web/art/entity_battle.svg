<?xml version="1.0" encoding="utf-8"?>
<!-- Crossed swords: one sword (blade, guard, grip, pommel) pointing up, drawn twice, rotated 45 degrees each way around the center. -->
<svg fill="#000000" width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
	<g transform="rotate(45 12 12)">
		<polygon points="12,1 13.2,3 13.2,15 10.8,15 10.8,3"/>
		<rect x="8" y="15" width="8" height="1.6" rx="0.5"/>
		<rect x="11.2" y="16.6" width="1.6" height="4.4"/>
		<circle cx="12" cy="22" r="1.3"/>
	</g>
	<g transform="rotate(-45 12 12)">
		<polygon points="12,1 13.2,3 13.2,15 10.8,15 10.8,3"/>
		<rect x="8" y="15" width="8" height="1.6" rx="0.5"/>
		<rect x="11.2" y="16.6" width="1.6" height="4.4"/>
		<circle cx="12" cy="22" r="1.3"/>
	</g>
</svg>
